# DID description file for ParaTNC / ParaMETEO
# Generated from include/etc/kiss_did_configuration.h (union of PARAMETEO and PARATNC definitions)
# Scaling a=0, b=1, c=0, d=1 is used wherever the real raw resolution is not known.
# Unit "-" means: unknown / dimensionless raw value.

[Header]
Description="Sketch of DID descriptions based on kiss_did_configuration.h, ParaMETEO and ParaTNC"
CreationDate="03102026"
VersionFrom="EC00"            # adjust to real lowest supported firmware version
VersionTo="FB00"              # adjust to real highest supported firmware version
